name: Daily News Scraper

on:
  schedule:
    # Täglich um 20:00 Berliner Zeit (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch: # Erlaubt manuelle Ausführung

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Direct Send Test
      id: direct_test
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        cd src
        python direct_send_test.py
        
    - name: Run news scraper
      id: scraper
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        cd src
        python telegram_bot.py > telegram_output.txt 2>&1 || echo "Script failed" >> telegram_output.txt
        echo "telegram_output<<EOF" >> $GITHUB_OUTPUT
        cat telegram_output.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Debug Telegram connection
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        cd src
        python debug_telegram.py
        
    - name: Upload debug data
      uses: actions/upload-artifact@v4
      with:
        name: debug-data-${{ github.run_number }}
        path: |
          src/direct_send_result.json
          src/secrets_check.json
          src/telegram_test_result.json
          src/daily_news.json
        retention-days: 7
        
    - name: Create summary
      run: |
        if [ -f "src/daily_news.json" ]; then
          echo "## 📰 Tagesnachrichten" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "import json; data = json.load(open('src/daily_news.json', 'r', encoding='utf-8')); print(f'**Datum:** {data[\"date\"][:10]}'); print(f'**Anzahl Nachrichten:** {data[\"news_count\"]}'); print(''); [print(f'### {i}. {news[\"title\"]}\n{news[\"summary\"]}\n*Quelle: {news[\"source\"]}*\n') for i, news in enumerate(data['news'], 1)]" >> $GITHUB_STEP_SUMMARY
        fi
