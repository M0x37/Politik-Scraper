name: Daily Politics Handwriting Sheet

on:
  schedule:
    # GitHub Actions schedules use UTC. 06:00 UTC is 08:00 CEST and
    # 07:00 UTC is 08:00 CET. The Berlin-time check below allows only
    # the run that is actually at 08:00 local time to continue.
    - cron: '0 6,7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-and-send-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Berlin execution time
        id: berlin-time
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(TZ=Europe/Berlin date +%H)" == "08" ]]; then
            echo "run_bot=true" >> "$GITHUB_OUTPUT"
            echo "Bot execution enabled at $(TZ=Europe/Berlin date '+%H:%M %Z')."
          else
            echo "run_bot=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this UTC trigger; Berlin time is $(TZ=Europe/Berlin date '+%H:%M %Z')."
          fi

      - name: Set up Python
        if: steps.berlin-time.outputs.run_bot == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        if: steps.berlin-time.outputs.run_bot == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: handwriting-converter/package-lock.json

      - name: Install Python dependencies
        if: steps.berlin-time.outputs.run_bot == 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install converter dependencies
        if: steps.berlin-time.outputs.run_bot == 'true'
        working-directory: handwriting-converter
        run: npm ci

      - name: Install Chromium for PNG rendering
        if: steps.berlin-time.outputs.run_bot == 'true'
        working-directory: handwriting-converter
        run: npx playwright install --with-deps chromium

      - name: Fetch five politics news and send one PNG sheet
        if: steps.berlin-time.outputs.run_bot == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python "Telegram Bot/telegram_bot.py"

      - name: Upload generated sheet and news data
        if: always() && steps.berlin-time.outputs.run_bot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: politics-handwriting-${{ github.run_number }}
          path: |
            daily_news.json
            daily_news_handwritten.png
          if-no-files-found: warn
          retention-days: 30

      - name: Add run summary
        if: always() && steps.berlin-time.outputs.run_bot == 'true'
        run: |
          if [ -f daily_news.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('daily_news.json').read_text(encoding='utf-8'))
          print('## Politik-Handschriftblatt')
          print(f"- Datum: {data.get('date', '')[:10]}")
          print(f"- Nachrichten: {data.get('news_count', 0)}")
          print(f"- Telegram gesendet: {data.get('telegram_sent', False)}")
          print('- Ausgabe: eine gemeinsame PNG-Datei mit allen fünf Nachrichten')
          for index, item in enumerate(data.get('news', []), 1):
              print(f"  {index}. {item.get('title', '')}")
          PY
          fi
